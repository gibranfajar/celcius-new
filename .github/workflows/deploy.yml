name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-only smoke check — the real values only matter for the
          # image actually deployed (see docker-compose.yml build.args on
          # the server), not for this CI build.
          NEXT_PUBLIC_API_URL: https://cms.clcs.co.id/api/v1
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ci-build-placeholder
          NEXT_PUBLIC_MIDTRANS_SNAP_URL: https://app.midtrans.com/snap/snap.js

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd /home/gibran/celcius/storefront-clcs/
            git pull origin main
            docker compose build
            docker compose up -d
            docker image prune -f
